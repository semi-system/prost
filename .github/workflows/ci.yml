name: MVP
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build developer image
        run: docker build -f Dockerfile.dev -t prost-dev .
      - name: Format
        run: sh scripts/docker-dev.sh cargo fmt --all -- --check
      - name: Clippy
        run: sh scripts/docker-dev.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: sh scripts/docker-dev.sh cargo test --workspace --locked
      - name: Static RAM cgroup fail-closed contract
        run: sh scripts/check-static-memory.sh
      - name: Benchmark parser contracts
        run: python3 -m unittest discover -s scripts/tests
      - name: Optional WASM compatibility
        run: sh scripts/docker-dev.sh cargo test --workspace --all-features --locked
      - name: Demo
        run: |
          docker compose up -d --build
          python3 scripts/smoke.py
      - name: Advanced protocol smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nghttp2-client
          # Keep the shared report parent owned by the runner. The mail soak
          # needs sudo for cgroup sampling and creates its own nested directory.
          mkdir -p test-results/advanced-ci
          sudo python3 scripts/mail-edge-soak.py --image prost:mvp --duration 180 --clients 2 --output-dir test-results/advanced-ci/mail-edge
          docker build -t prost:mail-stress-backend benchmarks/mail-stress
          sudo python3 scripts/mail-edge-soak.py --image prost:mvp --backend-image prost:mail-stress-backend --dns01 --duration 400 --clients 2 --stress --stress-connections 32 --stress-streams 2 --output-dir test-results/advanced-ci/mail-dns01
          python3 scripts/sni-smoke.py --image prost:mvp --output test-results/advanced-ci/sni-smoke.json
          docker tag prost:mvp prost:advanced-release
          python3 scripts/prepare-advanced-bench.py
          docker compose -f benchmarks/advanced/compose.yaml build backend
          sudo python3 scripts/advanced-bench.py --rounds 1 --scale 0.02 --output-dir test-results/advanced-ci
          sudo python3 scripts/advanced-backpressure.py --clients 4 --seconds 2 --output test-results/advanced-ci/backpressure.json
          sudo python3 scripts/balance-bench.py --image prost:mvp --rounds 1 --requests 512 --cases rr_uniform least_uniform rr_slow least_slow hash_uniform rr_backup least_backup rr_passive least_passive --output-dir test-results/advanced-ci/balance
          sudo python3 scripts/profile-memory.py --image prost:mvp --requests 256 --clients 8 --streams 2 --output-dir test-results/advanced-ci/memory
      - name: Logs
        if: failure()
        run: |
          docker compose logs
          docker compose -f benchmarks/advanced/compose.yaml logs
          docker compose -f benchmarks/balance/compose.yaml logs
      - name: Protocol reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advanced-protocol-reports
          path: test-results/advanced-ci
      - name: Stop demo
        if: always()
        run: |
          docker compose -f benchmarks/advanced/compose.yaml down -v
          docker compose -f benchmarks/balance/compose.yaml down -v
          docker compose down

  image:
    name: Build and scan release image
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and scan image
        id: image
        uses: abxst/actions/strict@670736025c229e0c308fc9a488cd5f008a96ca74 # v5
        with:
          registry: ghcr.io
          image-name: ${{ github.repository }}
          context: .
          dockerfile: ./Dockerfile
          # Publish the exact scanned image only after the Baseless gate below.
          push: 'false'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            CARGO_PROFILE=release
            CARGO_FEATURES=
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          report-artifact-name: image-security-reports
      - name: Verify Rust binary audit coverage
        env:
          REPORT: ${{ runner.temp }}/trivy-report.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          expected = {"usr/local/bin/prost", "usr/local/bin/prostctl", "usr/local/bin/prost-entrypoint", "usr/local/bin/prost-certd"}
          found = {r.get("Target", "").lstrip("/") for r in report.get("Results", []) if r.get("Type") == "rustbinary"}
          missing = expected - found
          if missing:
              raise SystemExit("Missing Rust dependency audit coverage: " + ", ".join(sorted(missing)))
          print("Verified Rust binary dependency coverage for all four executables")
          PY
      - name: Verify Baseless inventory and advisories
        uses: semi-system/baseless/scan@c9f6e9663c636e69dfa295058b896465a2dff962
        with:
          image: ghcr.io/${{ steps.image.outputs.image-name-lc }}:scan
          report: ${{ runner.temp }}/baseless-report.json
      - name: Baseless report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseless-security-report
          path: ${{ runner.temp }}/baseless-report.json
          if-no-files-found: ignore
      - name: Login for publication
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact scanned image
        id: publish
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SOURCE_IMAGE: ghcr.io/${{ steps.image.outputs.image-name-lc }}:scan
          IMAGE_TAGS: ${{ steps.image.outputs.image-tags }}
        run: |
          set -euo pipefail
          source_id=$(docker image inspect "$SOURCE_IMAGE" --format '{{.Id}}')
          first_digest=''
          pushed=0
          # Promote the floating tag only after the immutable commit tag exists.
          ordered_tags=$(printf '%s\n' "$IMAGE_TAGS" | awk 'NF && !/:latest$/ {print} /:latest$/ {latest=$0} END {if (latest != "") print latest}')
          while IFS= read -r target; do
            [[ -z "$target" ]] && continue
            docker tag "$SOURCE_IMAGE" "$target"
            [[ "$(docker image inspect "$target" --format '{{.Id}}')" == "$source_id" ]]
            log_file=$(mktemp)
            docker push "$target" 2>&1 | tee "$log_file"
            digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]*\).*/\1/p' "$log_file" | tail -n 1)
            rm -f "$log_file"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if [[ -z "$first_digest" ]]; then
              first_digest="$digest"
            else
              [[ "$digest" == "$first_digest" ]]
            fi
            printf 'Published image: %s@%s\n' "${target%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
            pushed=$((pushed + 1))
          done <<< "$ordered_tags"
          [[ "$pushed" -gt 0 ]]
          echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
