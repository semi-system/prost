[workspace]
resolver = "2"
members = ["crates/config", "crates/transport", "crates/http", "crates/plugin", "crates/core", "crates/control", "crates/cli", "crates/certd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
aws-credential-types = "1"
aws-sigv4 = "1"
aws-types = "1"
percent-encoding = "2"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] }
futures-util = "0.3"
arc-swap = "1.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
http = "1"
httpdate = "1"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
httparse = "1.10.1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "=0.0.8"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
# Only the text exposition encoder is used; do not ship the unused protobuf parser.
prometheus = { version = "0.13", default-features = false }
regex = "1"
pin-project-lite = "0.2"
once_cell = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "0.8"
url = "2"
tracing = "0.1"
tower-service = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wasmtime = { version = "29", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
webpki-roots = "0.26"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
