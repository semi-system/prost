schema_version = 1

[runtime]
admin_socket = "/run/prost/admin.sock"
artifact_dir = "/var/lib/prost/artifacts"
metrics_address = "127.0.0.1:9090"
reload_mode = "rolling"
io_workers = 2
drain_seconds = 30

[[upstreams.app.endpoints]]
id = "one"
# Replace with your backend address (host:port, without http://).
address = "127.0.0.1:8081"

[[listeners]]
id = "http"
address = "0.0.0.0:8080"
protocol = "http"
upstream = "app"
