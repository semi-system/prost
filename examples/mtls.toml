schema_version = 1
[runtime]
admin_socket = "/run/prost/admin.sock"
artifact_dir = "/var/lib/prost/artifacts"

[upstreams.secure.tls]
server_name = "backend.internal"
ca_certificate = "/etc/prost/backend-ca.pem"
[upstreams.secure.tls.identity]
certificate = "/etc/prost/proxy-client.pem"
private_key = "/etc/prost/proxy-client.key"
[[upstreams.secure.endpoints]]
id = "backend"
address = "127.0.0.1:9443"

[[listeners]]
id = "mutual-http"
address = "0.0.0.0:8443"
protocol = "http"
upstream = "secure"
[listeners.tls]
certificate = "/etc/prost/server.pem"
private_key = "/etc/prost/server.key"
client_ca = "/etc/prost/client-ca.pem"
