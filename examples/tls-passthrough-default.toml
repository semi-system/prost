schema_version = 1

[runtime]
admin_socket = "/run/prost/admin.sock"
artifact_dir = "/var/lib/prost/artifacts"
io_workers = 2
drain_seconds = 30

# This server already speaks TLS and holds its own certificate/key.
[upstreams.default]
[[upstreams.default.endpoints]]
id = "one"
address = "127.0.0.1:9443"

[upstreams.api]
[[upstreams.api.endpoints]]
id = "one"
address = "127.0.0.1:9444"

[[listeners]]
id = "edge"
address = "0.0.0.0:10443"
protocol = "tcp"
upstream = "default" # Unmatched or absent SNI uses this upstream.
tls_passthrough = true

[listeners.tls_passthrough_settings]
reject_unknown_sni = false
client_hello_timeout_ms = 5000
max_client_hello_bytes = 65536

[[listeners.tls_passthrough_settings.routes]]
server_names = ["api.example.test"]
upstream = "api"
