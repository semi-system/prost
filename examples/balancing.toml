schema_version = 1

[runtime]
admin_socket = "/run/prost/admin.sock"
artifact_dir = "/var/lib/prost/artifacts"
metrics_address = "127.0.0.1:9090"

[upstreams.web]
balance = "least_conn"
[[upstreams.web.endpoints]]
id = "blue"
address = "blue:8080"
weight = 2
[[upstreams.web.endpoints]]
id = "green"
address = "green:8080"

[upstreams.sticky]
balance = "consistent_hash"
hash_key = "$http_x_session"
hash_replicas = 160
[[upstreams.sticky.endpoints]]
id = "blue"
address = "blue:8080"
[[upstreams.sticky.endpoints]]
id = "green"
address = "green:8080"

[upstreams.echo]
balance = "consistent_hash"
hash_key = "$remote_addr"
[[upstreams.echo.endpoints]]
id = "blue"
address = "blue:9000"
[[upstreams.echo.endpoints]]
id = "green"
address = "green:9000"

[[listeners]]
id = "web"
address = "0.0.0.0:8080"
protocol = "http"
upstream = "web"
[[listeners.routes]]
path_prefix = "/sticky/"
upstream = "sticky"
[[listeners.plugins]]
name = "headers"
config = { response = { set = { x-proxy = "prost" } } }

[[listeners]]
id = "echo"
address = "0.0.0.0:9000"
protocol = "tcp"
upstream = "echo"
