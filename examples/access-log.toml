schema_version = 1

[runtime]
admin_socket = "/run/prost/admin.sock"
artifact_dir = "/var/lib/prost/artifacts"
metrics_address = "127.0.0.1:9090"

[runtime.access_log]
path = "/var/lib/prost/access.jsonl"
queue_capacity = 2048
sample_every = 1
include_query = false
max_path_bytes = 1024
flush_interval_ms = 1000

[upstreams.web]
observe_connection_reuse = true

[[upstreams.web.endpoints]]
id = "app"
address = "127.0.0.1:8081"

[[listeners]]
id = "http"
address = "0.0.0.0:8080"
protocol = "http"
upstream = "web"
access_log = true

[[listeners.routes]]
path_prefix = "/healthz"
upstream = "web"
access_log = false
