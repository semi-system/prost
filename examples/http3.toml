schema_version = 1

[runtime]
max_quic_receive_bytes = 67108864

[upstreams.web]
[[upstreams.web.endpoints]]
id = "one"
address = "127.0.0.1:8080"

[[listeners]]
id = "https"
address = "0.0.0.0:8443"
protocol = "http"
upstream = "web"
[listeners.tls]
certificate = "/run/certs/fullchain.pem"
private_key = "/run/certs/key.pem"
[[listeners.plugins]]
name = "headers"
config = { response = { set = { alt-svc = 'h3=":8443"; ma=300' } } }

[[listeners]]
id = "quic"
address = "0.0.0.0:8443"
protocol = "http3"
upstream = "web"
header_read_timeout_ms = 10000
[listeners.tls]
certificate = "/run/certs/fullchain.pem"
private_key = "/run/certs/key.pem"
[listeners.http3]
max_connections = 64
max_streams = 32
connection_receive_window = 1048576
stream_receive_window = 65536
send_window = 1048576
idle_timeout_ms = 60000
stream_write_timeout_ms = 30000
