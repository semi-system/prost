worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    keepalive_timeout 60s;
    keepalive_requests 100000;
    server {
        listen 8080 backlog=1024;
        location / {
            default_type application/json;
            return 200 '{"backend": "green", "path": "/"}\n';
        }
    }
}
