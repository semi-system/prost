[package]
name = "prost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
wasm = ["prost-core/wasm"]
[[bin]]
name = "prost"
path = "src/prost.rs"
[[bin]]
name = "prostctl"
path = "src/prostctl.rs"
[dependencies]
anyhow.workspace = true
clap.workspace = true
prost-config = { path = "../config" }
prost-core = { path = "../core" }
prost-control = { path = "../control" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
